<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>Joyo — JLPT N5/N4 Kanji</title>
<style>
:root{color-scheme:dark;--bg:#020617;--panel:#0f172a;--panel2:#111827;--line:#263449;--text:#f8fafc;--muted:#94a3b8;--cyan:#22d3ee;--violet:#8b5cf6;--red:#fb7185;--green:#34d399;--amber:#fbbf24}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#172554 0,#020617 42%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.safe{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom))}.wrap{width:min(100% - 24px,960px);margin:auto}.top{position:sticky;top:0;z-index:20;background:rgba(2,6,23,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(34,211,238,.18)}.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}.brand{font-weight:900;font-size:1.45rem;letter-spacing:-.04em}.sub{font-size:.72rem;color:var(--muted);margin-top:2px}.btn{min-height:48px;border:1px solid var(--line);border-radius:14px;background:#111827;color:var(--text);font-weight:800;padding:0 15px;cursor:pointer;touch-action:manipulation}.btn:active{transform:scale(.98)}.danger{border-color:#7f1d1d;color:#fda4af;background:#1f1117}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 10px}.tab.active{border-color:rgba(34,211,238,.65);background:rgba(34,211,238,.12);color:#a5f3fc}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}.stat{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:11px;text-align:center;box-shadow:0 0 24px rgba(34,211,238,.06)}.num{display:block;font-size:1.35rem;font-weight:950}.label{font-size:.68rem;color:var(--muted)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.cyan{background:#06b6d4;color:#031016;border-color:#22d3ee}.purple{background:#7c3aed;border-color:#8b5cf6}.panel{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:0 0 35px rgba(34,211,238,.06);margin-bottom:20px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;font-weight:800}.hero{text-align:center;padding:24px 4px 20px}.kanji{font-size:clamp(7rem,29vw,12rem);line-height:.9;font-weight:950;letter-spacing:-.08em}.meaning{font-size:1.35rem;font-weight:900;margin-top:12px}.box{border:1px solid var(--line);background:#0b1220;border-radius:18px;padding:14px;margin-top:10px}.box h3{font-size:.78rem;color:#67e8f9;margin:0 0 7px;text-transform:uppercase;letter-spacing:.08em}.box p{margin:0;color:#dbeafe;line-height:1.5}.vocab{display:grid;gap:8px}.v{padding:10px;border-radius:12px;background:#111827}.jp{font-weight:900;color:#a5f3fc}.read{color:var(--muted);font-size:.82rem}.en{color:#e2e8f0}.next{width:100%;margin-top:14px}.review{text-align:center}.review .kanji{font-size:clamp(7rem,30vw,11rem)}.reveal{width:100%;margin-top:20px}.ratings{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.forgot{background:#e11d48;border-color:#fb7185}.got{background:#10b981;color:#032018;border-color:#34d399}.dict{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.tile{position:relative;min-height:58px;border-radius:14px;border:1px solid var(--line);background:#0b1220;color:white;font-size:1.55rem;font-weight:950;cursor:pointer}.tile.learning{background:#f59e0b;color:#111827}.tile.mastered{background:#10b981;color:#032018}.dot{position:absolute;width:8px;height:8px;border-radius:50%;right:7px;top:7px;background:#475569}.learning .dot{background:#111827}.mastered .dot{background:#ecfdf5}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.72rem;margin:0 0 12px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#475569;margin-right:4px}.legend .l{background:#f59e0b}.legend .m{background:#10b981}.empty{text-align:center;color:var(--muted);padding:28px 8px}.footer{text-align:center;color:#64748b;font-size:.7rem;padding:5px 0 20px}@media(min-width:700px){.dict{grid-template-columns:repeat(10,minmax(0,1fr))}.panel{padding:28px}.kanji{font-size:11rem}}@media(max-width:380px){.actions{grid-template-columns:1fr}.dict{grid-template-columns:repeat(4,minmax(0,1fr))}.ratings{grid-template-columns:1fr}.stats{gap:5px}.wrap{width:min(100% - 16px,960px)}}
</style>
</head>
<body>
<div class="safe">
<header class="top"><div class="wrap topin"><div><div class="brand">Joyo</div><div class="sub">JLPT N5 • N4 Kanji — offline local dataset</div></div><button id="reset" class="btn danger">Reset</button></div></header>
<main class="wrap">
<div class="tabs"><button class="btn tab active" data-level="N5">JLPT N5</button><button class="btn tab" data-level="N4">JLPT N4</button></div>
<section class="stats"><div class="stat"><span id="mastered" class="num">0</span><span class="label">Mastered</span></div><div class="stat"><span id="active" class="num">0</span><span class="label">Learning</span></div><div class="stat"><span id="daily" class="num">0</span><span class="label">Today</span></div></section>
<nav class="actions"><button id="learnBtn" class="btn cyan">Learn</button><button id="reviewBtn" class="btn purple">Review</button><button id="dictBtn" class="btn">Dictionary</button></nav>
<section id="panel"></section>
<div class="footer">100% local • No API • No external data fetch • Progress saved on this device</div>
</main>
</div>
<script>
"use strict";
const DATA=[
["N5","一","one","一","One straight line is ONE.","一人|ひとり|one person","一つ|ひとつ|one thing"],
["N5","二","two","二","Two lines make TWO.","二人|ふたり|two people","二つ|ふたつ|two things"],
["N5","三","three","三","Three horizontal lines are THREE.","三人|さんにん|three people","三つ|みっつ|three things"],
["N5","四","four","囗","A box holds FOUR corners.","四人|よにん|four people","四つ|よっつ|four things"],
["N5","五","five","二","Five is balanced in the shape 五.","五月|ごがつ|May","五つ|いつつ|five things"],
["N5","六","six","八","The top opens like SIX spreading out.","六人|ろくにん|six people","六月|ろくがつ|June"],
["N5","七","seven","一","A crossing stroke marks SEVEN.","七人|しちにん|seven people","七月|しちがつ|July"],
["N5","八","eight","八","Two strokes spread apart: EIGHT.","八人|はちにん|eight people","八月|はちがつ|August"],
["N5","九","nine","乙","A hooked shape finishes NINE.","九人|きゅうにん|nine people","九月|くがつ|September"],
["N5","十","ten","十","A cross marks TEN.","十人|じゅうにん|ten people","十月|じゅうがつ|October"],
["N5","百","hundred","白","A marked white 百 means HUNDRED.","百円|ひゃくえん|100 yen","三百|さんびゃく|300"],
["N5","千","thousand","十","A marked ten grows to a THOUSAND.","千円|せんえん|1000 yen","千人|せんにん|1000 people"],
["N5","万","ten thousand","一","The sweeping 万 signals TEN THOUSAND.","一万|いちまん|10,000","万年|まんねん|ten thousand years"],
["N5","円","yen; circle","冂","A rounded shape suggests a CIRCLE and yen coin.","百円|ひゃくえん|100 yen","円い|まるい|round"],
["N5","日","day; sun","日","A square SUN marks a DAY.","日本|にほん|Japan","毎日|まいにち|every day"],
["N5","本","book; origin","木","A mark at the TREE ROOT means ORIGIN; also BOOK.","本|ほん|book","日本|にほん|Japan"],
["N5","人","person","人","Two legs form a PERSON.","人|ひと|person","日本人|にほんじん|Japanese person"],
["N5","月","month; moon","月","The curved form resembles a MOON.","月|つき|moon","月曜日|げつようび|Monday"],
["N5","火","fire","火","Four strokes flare like FIRE.","火|ひ|fire","火曜日|かようび|Tuesday"],
["N5","水","water","水","The center stream splashes as WATER.","水|みず|water","水曜日|すいようび|Wednesday"],
["N5","木","tree; wood","木","Trunk and branches form a TREE.","木|き|tree","木曜日|もくようび|Thursday"],
["N5","金","gold; money","金","Metal under a roof becomes GOLD or MONEY.","お金|おかね|money","金曜日|きんようび|Friday"],
["N5","土","earth; soil","土","A ground marker means EARTH.","土|つち|soil","土曜日|どようび|Saturday"],
["N5","山","mountain","山","Three peaks form a MOUNTAIN.","山|やま|mountain","火山|かざん|volcano"],
["N5","川","river","川","Three flowing strokes are a RIVER.","川|かわ|river","小川|おがわ|stream"],
["N5","田","field; rice paddy","田","A divided square is a RICE FIELD.","田んぼ|たんぼ|rice paddy","田舎|いなか|countryside"],
["N5","口","mouth; opening","口","A square OPENING is a MOUTH.","口|くち|mouth","入口|いりぐち|entrance"],
["N5","車","car; vehicle","車","The shape resembles a VEHICLE with wheels.","車|くるま|car","電車|でんしゃ|train"],
["N5","門","gate","門","Two doors make a GATE.","門|もん|gate","専門|せんもん|specialty"],
["N4","会","meet; meeting","人","People gather to MEET.","会う|あう|to meet","会社|かいしゃ|company"],
["N4","同","same; together","口","The SAME words fit one frame.","同じ|おなじ|same","同時|どうじ|same time"],
["N4","事","matter; thing","亅","A handled MATTER becomes a THING to deal with.","仕事|しごと|work","大事|だいじ|important"],
["N4","自","self; oneself","自","Point to your own nose: SELF.","自分|じぶん|oneself","自然|しぜん|nature"],
["N4","社","company; shrine","礻","An altar marks a SHRINE; 社 also means COMPANY.","会社|かいしゃ|company","神社|じんじゃ|Shinto shrine"],
["N4","発","departure; start","癶","Something shoots outward: START or DEPARTURE.","出発|しゅっぱつ|departure","発見|はっけん|discovery"],
["N4","者","person; someone","老","An OLD figure represents a PERSON.","医者|いしゃ|doctor","若者|わかもの|young person"],
["N4","地","ground; earth","土","Earth 土 forms the GROUND.","地図|ちず|map","地下|ちか|underground"],
["N4","業","work; occupation","木","A workbench suggests WORK and OCCUPATION.","仕事|しごと|work","授業|じゅぎょう|class; lesson"],
["N4","方","direction; way","方","An arrow-like shape points a DIRECTION.","方法|ほうほう|method","夕方|ゆうがた|evening"],
["N4","新","new","斤","An axe cuts fresh wood: NEW.","新しい|あたらしい|new","新聞|しんぶん|newspaper"],
["N4","場","place; location","土","A marked piece of ground is a PLACE.","場所|ばしょ|place","会場|かいじょう|venue"],
["N4","員","member; employee","口","A counted person is a MEMBER or EMPLOYEE.","会社員|かいしゃいん|company employee","店員|てんいん|shop clerk"],
["N4","立","stand","立","A person stands upright: STAND.","立つ|たつ|to stand","立場|たちば|position"],
["N4","開","open","門","A GATE swings OPEN.","開く|あく|to open","開ける|あける|to open something"],
["N4","電","electricity","雨","Rain-like energy over a field powers ELECTRICITY.","電気|でんき|electricity","電車|でんしゃ|train"],
["N4","天","sky; heaven","大","A large 大 under the sky marks HEAVEN.","天気|てんき|weather","天国|てんごく|heaven"],
["N4","気","spirit; air; mood","气","Air and vapor suggest SPIRIT and MOOD.","元気|げんき|healthy; energetic","天気|てんき|weather"],
["N4","雨","rain","雨","Drops fall inside the sky: RAIN.","雨|あめ|rain","大雨|おおあめ|heavy rain"],
["N4","雪","snow","雨","Rain turns white and becomes SNOW.","雪|ゆき|snow","大雪|おおゆき|heavy snow"],
["N4","度","degree; time","广","A measured turn gives a DEGREE or TIME.","温度|おんど|temperature","今度|こんど|this time; next time"],
["N4","高","high; expensive","高","A tall tower is HIGH; high price means EXPENSIVE.","高い|たかい|high; expensive","高校|こうこう|high school"],
["N4","安","cheap; safe","宀","Under a roof you feel SAFE; low price is CHEAP.","安い|やすい|cheap","安心|あんしん|peace of mind"],
["N4","小","small; little","小","Tiny strokes show SMALL.","小さい|ちいさい|small","小学校|しょうがっこう|elementary school"],
["N4","多","many; much","夕","Two evening shapes mean MANY.","多い|おおい|many","多分|たぶん|probably"],
["N4","少","few; little","小","A small mark means FEW or LITTLE.","少ない|すくない|few","少年|しょうねん|boy"],
["N4","古","old","口","Old words sit inside a mouth: OLD.","古い|ふるい|old","中古|ちゅうこ|used; secondhand"],
["N4","明","bright; clear","日","The SUN and MOON together are BRIGHT.","明るい|あかるい|bright","明日|あした|tomorrow"],
["N4","暗","dark","日","Without the sun, things become DARK.","暗い|くらい|dark","暗記|あんき|memorization"],
["N4","近","near; close","辶","Move along a path until something is NEAR.","近い|ちかい|near","最近|さいきん|recently"]
];
const db=DATA.map(a=>({level:a[0],k:a[1],meaning:a[2],radical:a[3],mnemonic:a[4],vocab:[a[5].split("|"),a[6].split("|")]}));
const KEY="joyo-local-srs-v2";
let progress={};try{progress=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){progress={}};
let level="N5",mode="learn",index=0,revealed=false;
const $=s=>document.querySelector(s);
const state=k=>progress[k]||{stage:0,seen:0,last:0};
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}}
function currentList(){return db.filter(x=>x.level===level)}
function stats(){
 const a=currentList(),m=a.filter(x=>state(x.k).stage>=4).length,l=a.filter(x=>state(x.k).stage>0&&state(x.k).stage<4).length,today=new Date().toDateString(),d=a.filter(x=>state(x.k).last&&new Date(state(x.k).last).toDateString()===today).length;
 $("#mastered").textContent=m;$("#active").textContent=l;$("#daily").textContent=d;
}
function vocabHTML(x){return x.vocab.map(v=>'<div class="v"><span class="jp">'+v[0]+'</span> <span class="read">('+v[1]+')</span><br><span class="en">'+v[2]+'</span></div>').join("")}
function learn(){
 mode="learn";revealed=false;const a=currentList();index=Math.max(0,Math.min(index,a.length-1));renderLearn();
}
function renderLearn(){
 stats();const a=currentList(),x=a[index];
 $("#panel").innerHTML='<div class="panel"><div class="meta"><span>'+x.level+'</span><span>'+(index+1)+' / '+a.length+'</span></div><div class="hero"><div class="kanji">'+x.k+'</div><div class="meaning">'+x.meaning+'</div></div><div class="box"><h3>Components / Radical</h3><p>'+x.radical+'</p></div><div class="box"><h3>Mnemonic</h3><p>'+x.mnemonic+'</p></div><div class="box"><h3>2 Real-world vocabulary</h3><div class="vocab">'+vocabHTML(x)+'</div></div><button id="next" class="btn cyan next">Next Kanji</button></div>';
 $("#next").onclick=()=>{index=(index+1)%a.length;renderLearn()};
}
function review(){
 mode="review";revealed=false;const a=currentList(),due=a.filter(x=>state(x.k).stage<4);const pool=due.length?due:a;index=Math.floor(Math.random()*pool.length);renderReview(pool);
}
function renderReview(pool){
 stats();const x=pool[index]||currentList()[0];
 $("#panel").innerHTML='<div class="panel review"><div class="meta"><span>SRS Review</span><span>'+x.level+'</span></div><div class="hero"><div class="kanji">'+x.k+'</div>'+ (revealed?'<div class="meaning">'+x.meaning+'</div>':'<div class="sub">Tap to reveal the answer</div>')+'</div>'+
(revealed?'<div class="box" style="text-align:left"><h3>Components / Radical</h3><p>'+x.radical+'</p></div><div class="box" style="text-align:left"><h3>Vocabulary</h3><div class="vocab">'+vocabHTML(x)+'</div></div><div class="ratings"><button id="forgot" class="btn forgot">❌ Forgot</button><button id="got" class="btn got">✅ Got It</button></div>':'<button id="reveal" class="btn purple reveal">Tap to Reveal</button>')+'</div>';
 if(!revealed)$("#reveal").onclick=()=>{revealed=true;renderReview(pool)};
 else{$("#forgot").onclick=()=>rate(x,false);$("#got").onclick=()=>rate(x,true)}
}
function rate(x,got){
 const s=state(x.k);s.stage=got?Math.min(4,s.stage+1):0;s.seen=(s.seen||0)+1;s.last=Date.now();progress[x.k]=s;save();review();
}
function dictionary(){
 mode="dict";stats();const a=currentList();
 $("#panel").innerHTML='<div class="panel"><div class="legend"><span><i></i>Unlearned</span><span><i class="l"></i>Learning</span><span><i class="m"></i>Mastered</span></div><div class="dict">'+a.map((x,i)=>{const s=state(x.k),c=s.stage>=4?"mastered":s.stage?"learning":"";return '<button class="tile '+c+'" data-i="'+i+'" aria-label="'+x.k+' '+x.meaning+'">'+x.k+'<i class="dot"></i></button>'}).join("")+'</div></div>';
 document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{index=Number(b.dataset.i);learn()});
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{level=b.dataset.level;index=0;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");learn()});
$("#learnBtn").onclick=learn;$("#reviewBtn").onclick=review;$("#dictBtn").onclick=dictionary;
$("#reset").onclick=()=>{if(confirm("Reset all local progress?")){progress={};save();location.reload()}};
stats();renderLearn();
</script>
</body>
</html>
