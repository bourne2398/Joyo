function cardKey(c){
  return c.kind==='word'
    ? 'word|'+c.level+'|'+c.word+'|'+c.wordReading
    : c.level+'|'+c.kanji;
}
function getStudyCards(level){
  const source=level==='N5WORDS'
    ? wordCards
    : level==='ALL'
      ? cards
      : cards.filter(c=>c.level===level);
  return source.filter(c=>{
    const key=cardKey(c);
    return !resultStore.knew.includes(key) && !resultStore.dontKnow.includes(key);
  });
}

function saveResult(type){
  const item=deck[index];
  if(!item)return;
  const key=cardKey(item);
  resultStore.knew=resultStore.knew.filter(x=>x!==key);
  resultStore.dontKnow=resultStore.dontKnow.filter(x=>x!==key);
  resultStore[type].push(key);
  localStorage.setItem('joyoKanjiResults',JSON.stringify(resultStore));
  updateResultNav();
}
async function loadVocabulary(){
  try{
    const response=await fetch('./vocabulary.json',{cache:'no-store'});
    if(!response.ok)throw new Error('Vocabulary file unavailable');
    vocabData=await response.json();
    const n5Kanji=new Set(cards.filter(c=>c.level==='N5').map(c=>c.kanji));
    const seen=new Set();
    wordCards=[];
    n5Kanji.forEach(kanji=>{
      const entries=Array.isArray(vocabData[kanji])?vocabData[kanji]:[];
      entries.forEach(v=>{
        const key=(v.word||'')+'|'+(v.reading||'');
        if(!v.word||!v.reading||seen.has(key))return;
        seen.add(key);
        wordCards.push({
          kind:'word',
          level:'N5',
          kanji,
          reading:v.reading,
          meaning:v.meaning||'',
          word:v.word,
          wordReading:v.reading,
          wordMeaning:v.meaning||''
        });
      });
    });
    $('n5words').disabled=false;
    $('moreVocabBtn').disabled=false;
    if(currentStudyLevel==='N5WORDS' || currentStudyLevel==='N5'){
      deck=getStudyCards(currentStudyLevel);
      index=Math.min(index,Math.max(0,deck.length-1));
      render();
    }
  }catch(e){
    console.error('Vocabulary load failed:',e);
    $('moreVocabBtn').disabled=false;
  }
}
function updateResultNav(){
  $('knewCount').textContent=resultStore.knew.length;
  $('dontCount').textContent=resultStore.dontKnow.length;
}
function recordAndMove(type, direction){
  saveResult(type);
  if(currentStudyLevel==='ALL' || currentStudyLevel==='N5' || currentStudyLevel==='N5WORDS' || currentStudyLevel==='N4'){
    deck=getStudyCards(currentStudyLevel);
    if(deck.length){
      index=Math.min(index,deck.length-1);
      render();
    }else{
      index=0;
      render();
    }
  }else{
    move(direction);
  }
}

  index=0;
  document.querySelectorAll('.level button').forEach(b=>b.classList.remove('active'));
  $(level.toLowerCase()).classList.add('active');
  render();
}
$('next').onclick=()=>move(1);$('prev').onclick=()=>move(-1);$('shuffle').onclick=shuffleDeck;$('knewNav').onclick=()=>showResults('knew');$('dontNav').onclick=()=>showResults('dontKnow');$('n5').onclick=()=>setLevel('N5');$('n5words').onclick=()=>setLevel('N5WORDS');$('n4').onclick=()=>setLevel('N4');$('all').onclick=()=>setLevel('ALL');
function resetResult(type){
  const label=type==='knew'?'Knew it':'Don’t know';
  if(!resultStore[type].length)return;
  if(!confirm('Reset all cards in "'+label+'"?'))return;
  resultStore[type]=[];
  localStorage.setItem('joyoKanjiResults',JSON.stringify(resultStore));
  updateResultNav();
  if(currentStudyLevel==='ALL'||currentStudyLevel==='N5'||currentStudyLevel==='N5WORDS'||currentStudyLevel==='N4'){
    deck=getStudyCards(currentStudyLevel);
    index=Math.min(index,Math.max(0,deck.length-1));
    render();
  }else{
    deck=[]; index=0; currentStudyLevel='ALL';
    setLevel('ALL');
  }
}
$('resetKnew').onclick=()=>resetResult('knew');
$('resetDont').onclick=()=>resetResult('dontKnow');
let sx=0,sy=0,swiping=false,suppressClick=false;
$('card').addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse' && e.button!==0)return;
  sx=e.clientX;sy=e.clientY;swiping=false;suppressClick=false;dragging=true;
  $('card').style.transition='none';
  $('card').setPointerCapture(e.pointerId);
});
$('card').addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>8 && Math.abs(dx)>Math.abs(dy))swiping=true;
  if(swiping){
    e.preventDefault();
    const base=flipped?'rotateY(180deg) ':'';
    $('card').style.transform=base+'translate3d('+dx+'px,0,0) rotateZ('+(dx/28)+'deg)';
  }
});
$('card').addEventListener('pointerup',e=>{
  if(!dragging)return;
  dragging=false;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(swiping && Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)){
    suppressClick=true;
    const type=dx<0?'dontKnow':'knew';
    const direction=1;
    $('card').style.transition='transform .22s ease-out';
    const base=flipped?'rotateY(180deg) ':'';
    $('card').style.transform=base+'translate3d('+(dx<0?window.innerWidth*1.2:-window.innerWidth*1.2)+'px,0,0) rotateZ('+(dx<0?25:-25)+'deg)';
    setTimeout(()=>{ $('card').style.transition=''; $('card').style.transform=''; recordAndMove(type,direction); },220);
  }else{
    $('card').style.transition='transform .18s ease';
    $('card').style.transform=flipped?'rotateY(180deg)':'';
    setTimeout(()=>{$('card').style.transition='';},180);
  }
});
$('card').addEventListener('pointercancel',()=>{
  dragging=false;$('card').style.transition='transform .18s ease';$('card').style.transform=flipped?'rotateY(180deg)':'';
  setTimeout(()=>{$('card').style.transition='';},180);
});
$('card').addEventListener('click',e=>{
  if(suppressClick){suppressClick=false;return}
  if(!dragging)flip();
});
function showResults(type){
  const keys=new Set(resultStore[type]);
  const matches=[...cards,...wordCards].filter(c=>keys.has(cardKey(c)));
  if(!matches.length){
    alert(type==='knew'?'No Knew it cards yet.':"No Don't know cards yet.");
    return;
  }
  deck=matches;
  index=0;
  currentStudyLevel=null;
  flipped=false;
  document.querySelectorAll('.level button').forEach(b=>b.classList.remove('active'));
  render();
}
updateResultNav();
setLevel('ALL');
$('moreVocabBtn').disabled=true;
$('n5words').disabled=true;
loadVocabulary();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script>
