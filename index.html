<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>Kanji Map</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#17191d;--muted:#737983;--line:#e2e5e9;--node:#17191d;--blue:#1677ff;--soft:#f0f1f3}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
body{overflow:hidden}.app{height:100dvh;width:100%;display:flex}.graph{position:relative;flex:0 0 70%;min-width:0;height:100%;overflow:hidden;background-color:#f7f8f9;background-image:linear-gradient(rgba(30,35,45,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(30,35,45,.055) 1px,transparent 1px);background-size:28px 28px}
.graph svg{width:100%;height:100%;display:block;cursor:grab}.graph svg:active{cursor:grabbing}.badge{position:absolute;z-index:2;top:16px;left:16px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);font-size:12px;font-weight:750;color:#555b63;box-shadow:0 8px 24px rgba(15,23,42,.06)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:7px;box-shadow:0 0 0 4px rgba(22,119,255,.14)}
.sidebar{flex:0 0 30%;min-width:320px;height:100%;overflow:auto;background:var(--panel);border-left:1px solid var(--line)}
.inner{padding:24px 25px 34px}.search{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#fafbfc;padding:0 15px;outline:0;font-size:14px;transition:.16s}.search:focus{background:#fff;border-color:#a8caff;box-shadow:0 0 0 4px rgba(22,119,255,.08)}
.message{min-height:18px;margin:7px 2px 0;color:#c04444;font-size:12px}.head{display:flex;gap:16px;align-items:flex-start;padding:13px 0 24px;border-bottom:1px solid #eceef0}.char{font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif;font-size:92px;line-height:.9;font-weight:500}.sub{margin-top:12px;color:var(--muted);font-size:14px}.preview{width:70px;height:88px;flex:none;border:1px solid var(--line);border-radius:12px;background:#fafbfc;display:grid;place-items:center;font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif;font-size:46px;position:relative}.preview small{position:absolute;bottom:6px;font-size:8px;color:#9aa0a8;text-transform:uppercase;letter-spacing:.08em}
.section{margin-top:22px}.title{display:inline-block;padding:6px 10px;border-radius:8px;background:var(--soft);color:#5b6068;font-size:12px;font-weight:800;margin-bottom:10px}.meaning{font-size:15px;font-weight:600}.rows{display:grid;gap:9px}.row{display:grid;grid-template-columns:82px 1fr;gap:10px;font-size:14px}.label{color:#8a9098;font-size:12px;font-weight:700}.jp{font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif;word-break:break-word}.info{display:grid;grid-template-columns:1fr 1fr;gap:9px}.box{padding:11px 12px;border:1px solid #e9ebee;border-radius:10px;background:#fcfcfd}.box b{display:block;color:#90959d;font-size:9px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}.box span{font-size:14px;font-weight:700}.radical{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #e9ebee;border-radius:10px;background:#fcfcfd}.radical-char{width:48px;height:48px;border-radius:10px;background:#f0f1f3;display:grid;place-items:center;font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif;font-size:27px}.radical-name{font-size:13px;font-weight:750}.radical-detail{font-size:12px;color:#81868e;margin-top:2px}.words{display:grid;gap:8px}.word{padding:11px 12px;border:1px solid #e9ebee;border-radius:10px;background:#fcfcfd}.word b{font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif;font-size:16px}.word i{font-style:normal;color:#858a92;font-size:12px;margin-left:5px}.word div{margin-top:3px;color:#626871;font-size:12px}
.edge{fill:none;stroke:#181a1e;stroke-width:1.8;stroke-linecap:round;opacity:.82}.node{cursor:pointer}.node circle.main{fill:var(--node);stroke:#fff;stroke-width:1.2}.node text{fill:#fff;text-anchor:middle;dominant-baseline:central;font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif;font-size:17px;font-weight:550;pointer-events:none}.node text.word{font-size:13px}.ring{fill:none;stroke:var(--blue);stroke-width:3;filter:url(#glow)}.halo{fill:none;stroke:rgba(22,119,255,.2);stroke-width:9}
@media(max-width:900px){body{overflow:auto}.app{display:block;height:auto;min-height:100dvh}.graph{height:60dvh;min-height:410px;max-height:700px;width:100%}.sidebar{width:100%;height:auto;min-width:0;border-left:0;border-top:1px solid var(--line);overflow:visible}.inner{padding:21px 18px 34px}}
@media(max-width:520px){.graph{height:58dvh;min-height:390px}.inner{padding:18px 15px 30px}.char{font-size:76px}.preview{width:64px;height:82px;font-size:42px}.badge{top:11px;left:11px}.row{grid-template-columns:75px 1fr}}
</style>
</head>
<body>
<div class="app">
<section class="graph" aria-label="Interactive Kanji network">
<div class="badge"><span class="dot"></span>Kanji Map</div>
<svg id="map" role="img" aria-label="Kanji relationship graph"></svg>
</section>
<aside class="sidebar">
<div class="inner">
<form id="form"><input id="search" class="search" type="search" placeholder="Search..." autocomplete="off" aria-label="Search Kanji or meaning"><div id="message" class="message" aria-live="polite"></div></form>
<div class="head"><div><div id="char" class="char">食</div><div id="sub" class="sub">food · eat</div></div><div id="preview" class="preview">食<small>stroke</small></div></div>
<section class="section"><div class="title">Meaning</div><div id="meaning" class="meaning"></div></section>
<section class="section"><div class="title">Reading</div><div id="readings" class="rows"></div></section>
<section class="section"><div class="title">Kanji Information</div><div id="info" class="info"></div></section>
<section class="section"><div class="title">Radical Information</div><div id="radical"></div></section>
<section class="section"><div class="title">Related Words</div><div id="words" class="words"></div></section>
</div>
</aside>
</div>
<script>
"use strict";
const DB={
食:{meaning:"food, eat",kun:"たべる、くう、くらう",on:"ショク、ジキ",nanori:"くい、じき",strokes:"9",grade:"2",occurrence:"Very common",jlpt:"N5",radical:["食","food","食部 · 9 strokes"],words:[["食べる","たべる","to eat"],["食事","しょくじ","meal"],["食品","しょくひん","food product"],["食堂","しょくどう","dining hall"]],nodes:[["a","𠆢","c",0],["b","丶","c",0],["c","一","c",0],["d","亼","c",1],["e","良","k",1],["f","食","t",2],["g","食品","w",3]],edges:[["a","d"],["b","d"],["c","d"],["d","f"],["e","f"],["f","g"]]},
良:{meaning:"good, fine, pleasing",kun:"よい",on:"リョウ",nanori:"あきら、よし",strokes:"7",grade:"4",occurrence:"Very common",jlpt:"N4",radical:["艮","stopping","艮部 · component"],words:[["良い","よい","good"],["良く","よく","well; often"],["良心","りょうしん","conscience"],["改良","かいりょう","improvement"]],nodes:[["a","丶","c",0],["b","一","c",0],["c","口","c",1],["d","艮","c",1],["e","良","t",2],["f","優","k",3]],edges:[["a","d"],["b","d"],["c","d"],["d","e"],["e","f"]]},
饗:{meaning:"feast, banquet, entertain",kun:"もてなす",on:"キョウ",nanori:"あえ",strokes:"22",grade:"S",occurrence:"Uncommon",jlpt:"—",radical:["食","food","食部 · semantic component"],words:[["饗宴","きょうえん","feast; banquet"],["饗応","きょうおう","hospitality; entertainment"]],nodes:[["a","乡","c",0],["b","幺","c",0],["c","艮","c",1],["d","食","k",2],["e","饗","t",3],["f","饗宴","w",4]],edges:[["a","c"],["b","c"],["c","d"],["d","e"],["e","f"]]},
養:{meaning:"foster, nourish, cultivate",kun:"やしなう",on:"ヨウ",nanori:"かい",strokes:"15",grade:"4",occurrence:"Common",jlpt:"N4",radical:["食","food","食部 · semantic component"],words:[["養う","やしなう","to nourish; to support"],["栄養","えいよう","nutrition"],["養成","ようせい","training; cultivation"],["養育","よういく","bringing up; rearing"]],nodes:[["a","羊","c",0],["b","一","c",0],["c","丿","c",1],["d","食","k",2],["e","養","t",3],["f","養育","w",4]],edges:[["a","c"],["b","c"],["c","d"],["d","e"],["e","f"]]}
};
const svg=d3.select("#map"), search=document.getElementById("search"), message=document.getElementById("message");
let currentKanji="食", zoom, viewport, resizeTimer;
const escape=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function sidebar(key){
 const d=DB[key]; document.getElementById("char").textContent=key;document.getElementById("sub").textContent=d.meaning.replaceAll(","," · ");document.getElementById("preview").innerHTML=key+"<small>stroke</small>";
 document.getElementById("meaning").textContent=d.meaning;
 document.getElementById("readings").innerHTML=[["Kunyomi",d.kun],["Onyomi",d.on],["Nanori",d.nanori]].map(x=>'<div class="row"><span class="label">'+x[0]+'</span><span class="jp">'+escape(x[1]||"—")+"</span></div>").join("");
 document.getElementById("info").innerHTML=[["Strokes",d.strokes],["Grade",d.grade],["Occurrence",d.occurrence],["JLPT",d.jlpt]].map(x=>'<div class="box"><b>'+x[0]+'</b><span>'+escape(x[1])+"</span></div>").join("");
 document.getElementById("radical").innerHTML='<div class="radical"><div class="radical-char">'+escape(d.radical[0])+'</div><div><div class="radical-name">'+escape(d.radical[1])+'</div><div class="radical-detail">'+escape(d.radical[2])+"</div></div></div>";
 document.getElementById("words").innerHTML=d.words.map(w=>'<div class="word"><b>'+escape(w[0])+'</b><i>'+escape(w[1])+'</i><div>'+escape(w[2])+"</div></div>").join("");
}
function size(){const r=document.getElementById("map").getBoundingClientRect();return{w:Math.max(300,r.width),h:Math.max(360,r.height)}}
function radius(n){return n.type==="t"?32:n.type==="w"?28:26}
function layout(d){
 const {w,h}=size(), max=d.nodes.reduce((m,n)=>Math.max(m,n[3]),0), pad=Math.max(55,w*.07), gap=max?Math.max(65,(w-pad*2)/max):0, by=d3.group(d.nodes,n=>n[3]), pos=new Map();
 d.nodes.forEach(n=>{const list=by.get(n[3]),i=list.indexOf(n), usable=Math.max(130,h-110), y=list.length===1?h/2:55+i*(usable/(list.length-1));pos.set(n[0],{id:n[0],label:n[1],type:n[2],layer:n[3],x:pad+n[3]*gap,y})});
 return{nodes:[...pos.values()],edges:d.edges.map(e=>({s:pos.get(e[0]),t:pos.get(e[1])})).filter(e=>e.s&&e.t),w,h}
}
function path(e){const rs=radius(e.s),rt=radius(e.t),x1=e.s.x+rs,y1=e.s.y,x2=e.t.x-rt,y2=e.t.y,c=Math.min(100,Math.max(35,(x2-x1)*.4));return"M"+x1+","+y1+" C"+(x1+c)+","+y1+" "+(x2-c)+","+y2+" "+x2+","+y2}
function center(nodes){
 const a=nodes.find(n=>n.label===currentKanji);if(!a||!zoom)return;const {w,h}=size(),tr=d3.zoomIdentity.translate(w/2-a.x,h/2-a.y);svg.transition().duration(520).ease(d3.easeCubicInOut).call(zoom.transform,tr)
}
function render(d){
 svg.selectAll("*").remove();const {nodes,edges,w,h}=layout(d);svg.attr("viewBox","0 0 "+w+" "+h);
 const defs=svg.append("defs"),marker=defs.append("marker").attr("id","arrow").attr("viewBox","0 -5 10 10").attr("refX",9).attr("refY",0).attr("markerWidth",7).attr("markerHeight",7).attr("orient","auto");
 marker.append("path").attr("d","M0,-4L10,0L0,4Z").attr("fill","#181a1e");
 const glow=defs.append("filter").attr("id","glow").attr("x","-100%").attr("y","-100%").attr("width","300%").attr("height","300%");glow.append("feGaussianBlur").attr("stdDeviation",4).attr("result","b");const m=glow.append("feMerge");m.append("feMergeNode").attr("in","b");m.append("feMergeNode").attr("in","SourceGraphic");
 viewport=svg.append("g");
 viewport.append("g").selectAll("path").data(edges).join("path").attr("class","edge").attr("d",path).attr("marker-end","url(#arrow)").style("opacity",0).transition().duration(350).delay((_,i)=>i*30).style("opacity",1);
 const ns=viewport.append("g").selectAll("g").data(nodes).join("g").attr("class","node").attr("transform",n=>"translate("+n.x+","+n.y+")").style("opacity",0);
 ns.append("circle").attr("class","halo").attr("r",n=>radius(n)+7).style("opacity",n=>n.label===currentKanji?1:0);
 ns.append("circle").attr("class","ring").attr("r",n=>radius(n)+5).style("opacity",n=>n.label===currentKanji?1:0);
 ns.append("circle").attr("class","main").attr("r",radius);
 ns.append("text").attr("class",n=>n.type==="w"?"word":"").text(n=>n.label);
 ns.on("click",(_,n)=>{if(DB[n.label])updateApp(n.label);else{message.textContent='"'+n.label+'" is a component, not a detail entry.';setTimeout(()=>message.textContent="",2200)}}).transition().duration(380).delay((_,i)=>i*25).style("opacity",1);
 zoom=d3.zoom().scaleExtent([.65,2.6]).on("zoom",e=>viewport.attr("transform",e.transform));svg.call(zoom);requestAnimationFrame(()=>center(nodes))
}
function updateApp(key){if(!DB[key])return false;currentKanji=key;search.value=key;message.textContent="";sidebar(key);render(DB[key]);return true}
function find(q){q=q.trim().toLocaleLowerCase();if(!q)return null;const exact=Object.keys(DB).find(k=>k===q||k===q.toLocaleUpperCase());if(exact)return exact;return Object.keys(DB).find(k=>{const d=DB[k],hay=[k,d.meaning,d.kun,d.on,d.nanori,d.radical[1],...d.words.flat()].join(" ").toLocaleLowerCase();return hay.includes(q)})||null}
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();const k=find(search.value);if(!k){message.textContent='No Kanji found for "'+search.value.trim()+'".';return}updateApp(k)});
window.addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>render(DB[currentKanji]),120)});
updateApp("食");
</script>
</body>
</html>
