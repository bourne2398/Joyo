function parse(rows,level){return rows.map(x=>{const a=x.split('|');return{level,kanji:a[0],reading:a[1],meaning:a[2],word:a[3],wordReading:a[4],wordMeaning:a[5]}})}

let deck=cards.slice(), index=0, flipped=false;
let swipeX=0, swipeY=0, dragging=false;
const resultStore=JSON.parse(localStorage.getItem('joyoKanjiResults')||'{"knew":[],"dontKnow":[]}');
function saveResult(type){
  const item=deck[index];
  if(!item)return;
  const key=item.level+'|'+item.kanji;
  resultStore.knew=resultStore.knew.filter(x=>x!==key);
  resultStore.dontKnow=resultStore.dontKnow.filter(x=>x!==key);
  resultStore[type].push(key);
  localStorage.setItem('joyoKanjiResults',JSON.stringify(resultStore));
  updateResultNav();
}
function updateResultNav(){
  $('knewCount').textContent=resultStore.knew.length;
  $('dontCount').textContent=resultStore.dontKnow.length;
}
function recordAndMove(type, direction){
  saveResult(type);
  move(direction);
}
const $=id=>document.getElementById(id);
function render(){const c=deck[index]; if(!c)return; $('frontKanji').textContent=c.kanji;$('backKanji').textContent=c.kanji;$('frontLevel').textContent=c.level;$('backLevel').textContent=c.level;$('reading').textContent=c.reading;$('meaning').textContent=c.meaning;$('word').textContent=c.word;$('wordInfo').textContent=c.wordReading+' — '+c.wordMeaning;$('count').textContent=(index+1)+' / '+deck.length;flipped=false;$('card').classList.remove('flip')}
function flip(){flipped=!flipped;$('card').classList.toggle('flip',flipped)}
function move(n){index=(index+n+deck.length)%deck.length;render()}
function setLevel(level){deck=level==='ALL'?cards.slice():cards.filter(c=>c.level===level);index=0;document.querySelectorAll('.level button').forEach(b=>b.classList.remove('active'));$(level.toLowerCase()).classList.add('active');render()}
$('card').addEventListener('click',flip);$('flip').onclick=flip;$('next').onclick=()=>move(1);$('prev').onclick=()=>move(-1);$('know').onclick=()=>recordAndMove('knew',1);$('miss').onclick=()=>recordAndMove('dontKnow',1);$('knewNav').onclick=()=>showResults('knew');$('dontNav').onclick=()=>showResults('dontKnow');$('n5').onclick=()=>setLevel('N5');$('n4').onclick=()=>setLevel('N4');$('all').onclick=()=>setLevel('ALL');
let sx=0,sy=0;
$('card').addEventListener('pointerdown',e=>{
  sx=e.clientX;sy=e.clientY;swipeX=0;swipeY=0;dragging=true;
  $('card').style.transition='none';
  $('card').setPointerCapture(e.pointerId);
});
$('card').addEventListener('pointermove',e=>{
  if(!dragging)return;
  swipeX=e.clientX-sx;swipeY=e.clientY-sy;
  if(Math.abs(swipeX)>Math.abs(swipeY)){
    $('card').style.transform='translateX('+swipeX+'px) rotateY('+(flipped?180:0)+'deg) rotateZ('+(swipeX/30)+'deg)';
  }
});
$('card').addEventListener('pointerup',e=>{
  if(!dragging)return;
  dragging=false;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  $('card').style.transition='';
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)){
    if(dx<0) recordAndMove('knew',1);
    else recordAndMove('dontKnow',1);
  }else{
    $('card').style.transform='';
  }
});
$('card').addEventListener('pointercancel',()=>{
  dragging=false;$('card').style.transition='';$('card').style.transform='';
});
function showResults(type){
  const keys=new Set(resultStore[type]);
  if(!keys.size){alert(type==='knew'?'No Knew it cards yet.':'No Don\'t know cards yet.');return;}
  const matches=cards.filter(c=>keys.has(c.level+'|'+c.kanji));
  alert((type==='knew'?'Knew it':'Don\'t know')+' — '+matches.length+' cards\\n\\n'+matches.map(c=>c.kanji+'  '+c.reading).join('\\n'));
}
updateResultNav();
render();
</script>
