<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jōyō Kanji Flashcards</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--accent:#111827;--pill:#eef0f3}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-bottom:24px}.app{width:min(100%,1100px);margin:auto;padding:12px}
header{position:sticky;top:0;z-index:10;background:rgba(245,246,248,.96);backdrop-filter:blur(12px);padding:8px 0 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:20px;font-weight:800}.count{font-size:13px;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
input,button{font:inherit}input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff;outline:none}
button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-weight:700;cursor:pointer}
button:active{transform:scale(.98)}
.levels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:9px}
.level-btn{padding:10px 5px;border-radius:12px;background:var(--pill);font-size:13px;min-width:0}
.level-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.level-btn span{display:block;font-size:11px;font-weight:500;opacity:.72;margin-top:2px}
.progress{height:4px;background:#e5e7eb;border-radius:999px;margin-top:10px;overflow:hidden}.bar{height:100%;width:100%;background:#111827;transform-origin:left}
.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:4px}
.card{perspective:1200px;min-height:390px}.inner{position:relative;width:100%;height:100%;min-height:390px;transition:transform .42s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px rgba(15,23,42,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.front .kanji{font-family:"Noto Sans JP","Yu Gothic",sans-serif;font-size:clamp(130px,24vw,210px);line-height:.95;font-weight:500}
.level-badge{position:absolute;top:18px;left:18px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;background:#fff;color:var(--text)}
.tap{position:absolute;bottom:20px;color:var(--muted);font-size:13px}
.back{transform:rotateY(180deg);align-items:stretch;justify-content:flex-start;text-align:left}
.meaning{font-size:clamp(24px,5vw,38px);font-weight:800;margin-bottom:20px;text-align:center}
.section{border-top:1px solid var(--line);padding:14px 0}.label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.reading{font-size:clamp(22px,5vw,32px);font-family:"Noto Sans JP","Yu Gothic",sans-serif;line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
@media(max-width:430px){.levels{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:700px){.app{padding:18px 22px}.card{min-height:500px}.inner,.face{min-height:500px}.front .kanji{font-size:260px}}

.view-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.view-tab{padding:12px;border-radius:14px;background:#eef0f3;border:1px solid var(--line)}
.view-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.hidden{display:none!important}
.radical-view{margin-top:14px}
.radical-head{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.05)}
.radical-title{font-size:18px;font-weight:850}
.radical-sub{font-size:13px;color:var(--muted);margin-top:4px}
.radical-tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.radical-tools input{padding:12px 14px}
.stroke-row{display:flex;gap:6px;overflow:auto;padding:9px 0 2px;scrollbar-width:none}
.stroke-row::-webkit-scrollbar{display:none}
.stroke-chip{white-space:nowrap;padding:8px 11px;border-radius:999px;background:var(--pill);border:1px solid var(--line);font-size:12px;font-weight:750}
.stroke-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.radical-list{display:grid;gap:9px;margin-top:12px}
.radical-group{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px}
.radical-group-head{display:flex;align-items:center;gap:12px}
.radical-symbol{font-family:"Noto Sans JP","Yu Gothic",sans-serif;font-size:48px;line-height:1;width:58px;text-align:center}
.radical-info{min-width:0;flex:1}
.radical-name{font-weight:850;font-size:15px}
.radical-reading{font-size:12px;color:var(--muted);margin-top:2px}
.radical-count{font-size:12px;font-weight:850;white-space:nowrap}
.radical-kanji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.radical-kanji{min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;font-family:"Noto Sans JP","Yu Gothic",sans-serif;font-size:25px;font-weight:500;cursor:pointer}
.radical-kanji:active{transform:scale(.96)}
.radical-study{margin-top:11px;width:100%;padding:10px}
@media(max-width:430px){.view-tabs{grid-template-columns:1fr 1fr}.radical-tools{grid-template-columns:1fr}.radical-symbol{font-size:42px}}
</style></head><body><div class="app">

const grid=document.getElementById('grid');
const radicalView=document.getElementById('radicalView');
const search=document.getElementById('search');
const count=document.getElementById('count');
const bar=document.getElementById('bar');
const levels=document.getElementById('levels');
const viewTabs=document.getElementById('viewTabs');
let selectedLevel='ALL';
let selectedRadical='ALL';
let activeView='cards';
let radicalQuery='';
let radicalStroke='ALL';

const radicalGroups={};
for(const c of CARDS){
  const r=RADICAL_OF[c.kanji];
  if(r)(radicalGroups[r]??=[]).push(c);
}
const RADICALS=Object.keys(radicalGroups).sort((a,b)=>{
  const sa=RADICAL_META[a]?.strokes||0, sb=RADICAL_META[b]?.strokes||0;
  return sa-sb || a.localeCompare(b,'ja');
});

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function filteredCards(){
  const q=search.value.trim().toLowerCase();
  return CARDS.filter(c=>{
    const levelOK=selectedLevel==='ALL'||c.level===selectedLevel;
    const radicalOK=selectedRadical==='ALL'||RADICAL_OF[c.kanji]===selectedRadical;
    const queryOK=!q||c.kanji.includes(q)||c.meaning.toLowerCase().includes(q)||[...c.on,...c.kun].some(x=>x.includes(q));
    return levelOK&&radicalOK&&queryOK;
  });
}

function render(){
  const view=filteredCards();
  count.textContent=view.length+' / '+CARDS.length+' kanji';
  grid.innerHTML=view.map(c=>'<article class="card" tabindex="0"><div class="inner"><section class="face front"><div class="level-badge">'+c.level+'</div><div class="kanji">'+c.kanji+'</div><div class="tap">Tap to reveal</div></section><section class="face back"><div class="level-badge">'+c.level+'</div><div class="meaning">'+escapeHtml(c.meaning)+'</div><div class="section"><div class="label">Radical</div><div class="reading">'+escapeHtml(c.radical||RADICAL_OF[c.kanji]||'')+'</div></div>'+(c.on.length?'<div class="section"><div class="label">On’yomi</div><div class="reading">'+c.on.join('・')+'</div></div>':'')+(c.kun.length?'<div class="section"><div class="label">Kun’yomi</div><div class="reading">'+c.kun.join('・')+'</div></div>':'')+'</section></div></article>').join('')||'<div class="empty">No kanji found.</div>';
  document.querySelectorAll('.card').forEach(el=>{
    const flip=()=>el.classList.toggle('flipped');
    el.addEventListener('click',flip);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});
  });
  bar.style.width=CARDS.length?((view.length/CARDS.length)*100)+'%':'0%';
}

function renderRadicals(){
  const q=radicalQuery.trim().toLowerCase();
  const groups=RADICALS.filter(r=>{
    const m=RADICAL_META[r]||{};
    const strokeOK=radicalStroke==='ALL'||String(m.strokes)===radicalStroke;
    const text=(r+' '+(m.longName||'')+' '+(m.reading||'')).toLowerCase();
    return strokeOK&&(!q||text.includes(q));
  });
  radicalView.innerHTML='<div class="radical-head"><div class="radical-title">Jōyō Kanji Radical Map</div><div class="radical-sub">'+groups.length+' radical groups · '+CARDS.length+' kanji. Each kanji is filed under one dictionary radical.</div><div class="radical-tools"><input id="radicalSearch" value="'+escapeHtml(radicalQuery)+'" placeholder="Search radical, reading, or 部…"><button id="clearRadical">Clear</button></div><div class="stroke-row"><button class="stroke-chip '+(radicalStroke==='ALL'?'active':'')+'" data-stroke="ALL">All strokes</button>'+[...new Set(RADICALS.map(r=>RADICAL_META[r]?.strokes).filter(Boolean))].sort((a,b)=>a-b).map(n=>'<button class="stroke-chip '+(radicalStroke===String(n)?'active':'')+'" data-stroke="'+n+'">'+n+' strokes</button>').join('')+'</div></div><div class="radical-list">'+groups.map(r=>{
    const m=RADICAL_META[r]||{};
    const arr=radicalGroups[r];
    return '<article class="radical-group"><div class="radical-group-head"><div class="radical-symbol">'+escapeHtml(r)+'</div><div class="radical-info"><div class="radical-name">'+escapeHtml(m.longName||r)+'</div><div class="radical-reading">'+escapeHtml(m.reading||'')+'</div></div><div class="radical-count">'+arr.length+' kanji</div></div><div class="radical-kanji-grid">'+arr.map(c=>'<button class="radical-kanji" data-kanji="'+escapeHtml(c.kanji)+'" title="'+escapeHtml(c.kanji+' · '+c.meaning)+'">'+c.kanji+'</button>').join('')+'</div><button class="radical-study" data-study-radical="'+escapeHtml(r)+'">Study this radical →</button></article>';
  }).join('')+'</div>';
  document.getElementById('radicalSearch').addEventListener('input',e=>{radicalQuery=e.target.value;renderRadicals()});
  document.getElementById('clearRadical').addEventListener('click',()=>{radicalQuery='';radicalStroke='ALL';renderRadicals()});
  radicalView.querySelectorAll('[data-stroke]').forEach(b=>b.addEventListener('click',()=>{radicalStroke=b.dataset.stroke;renderRadicals()}));
  radicalView.querySelectorAll('[data-study-radical]').forEach(b=>b.addEventListener('click',()=>{
    selectedRadical=b.dataset.studyRadical;
    activeView='cards';
    viewTabs.querySelectorAll('.view-tab').forEach(x=>x.classList.toggle('active',x.dataset.view==='cards'));
    grid.classList.remove('hidden');radicalView.classList.add('hidden');
    render();scrollTo({top:0,behavior:'smooth'});
  }));
  radicalView.querySelectorAll('[data-kanji]').forEach(b=>b.addEventListener('click',()=>{
    search.value=b.dataset.kanji;
    selectedRadical='ALL';
    activeView='cards';
    viewTabs.querySelectorAll('.view-tab').forEach(x=>x.classList.toggle('active',x.dataset.view==='cards'));
    grid.classList.remove('hidden');radicalView.classList.add('hidden');
    render();scrollTo({top:0,behavior:'smooth'});
  }));
}

viewTabs.addEventListener('click',e=>{
  const b=e.target.closest('.view-tab');if(!b)return;
  activeView=b.dataset.view;
  viewTabs.querySelectorAll('.view-tab').forEach(x=>x.classList.toggle('active',x===b));
  const cardsMode=activeView==='cards';
  grid.classList.toggle('hidden',!cardsMode);
  radicalView.classList.toggle('hidden',cardsMode);
  if(cardsMode) render(); else renderRadicals();
});

search.addEventListener('input',render);
document.getElementById('reset').onclick=()=>{
  selectedLevel='ALL';selectedRadical='ALL';search.value='';
  document.querySelectorAll('.level-btn').forEach(b=>b.classList.toggle('active',b.dataset.level==='ALL'));
  render();scrollTo({top:0,behavior:'smooth'});
};
document.getElementById('shuffle').onclick=()=>{
  for(let i=CARDS.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[CARDS[i],CARDS[j]]=[CARDS[j],CARDS[i]]}
  render();scrollTo({top:0,behavior:'smooth'});
};
levels.addEventListener('click',e=>{
  const b=e.target.closest('.level-btn');if(!b)return;
  selectedLevel=b.dataset.level;
  document.querySelectorAll('.level-btn').forEach(x=>x.classList.toggle('active',x===b));
  render();scrollTo({top:0,behavior:'smooth'});
});
render();
</script></body></html>
