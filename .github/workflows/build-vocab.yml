name: Build Joyo vocabulary

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-vocab.yml"
      - "index.html"

permissions:
  contents: write

jobs:
  build-vocabulary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download JMdict
        run: |
          curl -L --fail --retry 3 -o /tmp/jmdict.zip "https://github.com/yomidevs/jmdict-yomitan/releases/download/2026-09-29/JMdict_english_without_proper_names.zip"
          unzip -o /tmp/jmdict.zip -d /tmp/jmdict

      - name: Build vocabulary
        run: |
          python - <<'PY'
          import json, pathlib, re

          html=pathlib.Path("index.html").read_text(encoding="utf-8")
          n5=set()
          n4=set()
          m=re.search(r'const N5 = \`(.*?)\`\.trim\(\)\.split\(',html,re.S)
          if m:
              n5={line.split("|",1)[0] for line in m.group(1).strip().splitlines() if "|" in line}
          m=re.search(r'const N4 = \`(.*?)\`\.trim\(\)\.split\(',html,re.S)
          if m:
              n4={line.split("|",1)[0] for line in m.group(1).strip().splitlines() if "|" in line}
          targets=sorted(n5|n4)

          def hira(s):
              return "".join(chr(ord(c)-0x60) if "ァ"<=c<="ヺ" else c for c in s)

          def strings(x):
              out=[]
              if isinstance(x,str):
                  return [x.strip()]
              if isinstance(x,list):
                  for y in x: out.extend(strings(y))
              elif isinstance(x,dict):
                  for key in ("gloss","text","content"):
                      if key in x: out.extend(strings(x[key]))
              return [x for x in out if x]

          banks=list(pathlib.Path("/tmp/jmdict").glob("term_bank_*.json"))
          if not banks:
              raise SystemExit("No JMdict term banks found")

          out={}
          for kanji in targets:
              candidates=[]
              for path in banks:
                  rows=json.loads(path.read_text(encoding="utf-8"))
                  for row in rows:
                      if not isinstance(row,list) or len(row)<6: continue
                      word=str(row[0] or "").strip()
                      reading=hira(str(row[1] or "").strip())
                      if kanji not in word: continue
                      if not reading or not re.fullmatch(r"[ぁ-ゖゝゞー]+",reading): continue
                      if len(word)>12 or len(reading)>20: continue
                      glosses=strings(row[5])
                      if not glosses: continue
                      gloss="; ".join(dict.fromkeys(glosses))[:180]
                      try: score=float(row[4] or 0)
                      except: score=0
                      candidates.append((score,word,reading,gloss))

              candidates.sort(key=lambda x:(-x[0],len(x[1]),x[1],x[2]))
              seen=set()
              words=[]
              for score,word,reading,gloss in candidates:
                  key=(word,reading)
                  if key in seen: continue
                  seen.add(key)
                  words.append({"word":word,"reading":reading,"meaning":gloss})
                  if len(words)>=20: break

              if len(words)<20:
                  raise SystemExit(f"{kanji}: only {len(words)} verified vocabulary entries")
              out[kanji]=words

          pathlib.Path("vocabulary.json").write_text(json.dumps(out,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          print("Built",len(out),"kanji and",sum(map(len,out.values())),"verified vocabulary entries")
          PY

      - name: Commit vocabulary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vocabulary.json
          if git diff --cached --quiet; then
            echo "No vocabulary changes"
          else
            git commit -m "Add 20 verified vocabulary entries per kanji"
            git push
          fi
